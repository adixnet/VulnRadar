name: Feature Request
description: Suggest a new feature or improvement for VulnRadar
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make VulnRadar better? Fill out the form below. Be as specific as possible — it helps us prioritize and implement faster.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve? What's the current limitation?
      placeholder: "Currently, VulnRadar doesn't detect X, which means..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you'd like to see added or changed.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      options:
        - New scanner module / vulnerability check
        - Existing scan phase improvement
        - AI analysis / reporting
        - UI / UX
        - Performance
        - Developer tooling / CI
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches or workarounds?
    validations:
      required: false

  - type: textarea
    id: ethics
    attributes:
      label: Responsible Usage Consideration
      description: |
        VulnRadar is a security tool. If this feature involves new payloads, scanning techniques, or data collection, briefly describe how it stays within ethical/legal boundaries (detection only, no destructive actions, etc.).
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, links, references, or examples that support this request.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This feature does not facilitate unauthorized scanning or malicious use.
          required: true
