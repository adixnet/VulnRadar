name: Bug Report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below so we can reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I scan X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Enter target '...'
        3. Click '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages, console output, or screenshots.
    validations:
      required: true

  - type: dropdown
    id: scan-phase
    attributes:
      label: Which scan phase is affected?
      options:
        - Recon (DNS, subdomains, HTTP headers)
        - Active (SSL, file probing, port scan, spider)
        - Attack (SQLi, XSS, CORS, open redirect)
        - AI Analysis (executive summary)
        - Scan Comparison
        - UI / General
        - Not sure
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser & Version
      placeholder: "e.g. Chrome 124, Firefox 125"
    validations:
      required: false

  - type: input
    id: node-version
    attributes:
      label: Node.js Version (if running locally)
      placeholder: "e.g. v20.11.0"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, logs, or screenshots.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am only scanning targets I own or have explicit authorization to test.
          required: true
